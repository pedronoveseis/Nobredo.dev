[build]
  publish = "site"

[functions]
  included_files = ["content/drops.json"]

# O link dela: /p/<token>. A função valida o token; o HTML é só a casca vazia.
[[redirects]]
  from = "/p/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
